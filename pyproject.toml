[project]
name = "mason-ai"
version = "0.1.0"
description = "A small personal AI toolkit, starting with Telegram search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "telethon>=1.45,<2",
    "pydantic-settings>=2.15,<3",
    "pyjwt[crypto]>=2.15,<3",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.16,<1"]

[project.scripts]
mason = "mason.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mason"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
